<!-- Date Picker -->
<template>
  <div class={dropdownClass} onclick={handleDatepickerClick}>
    <label lwc:if={label} class="slds-form-element__label" for="date-input-id-default"
      >{label}</label
    >
    <div
      class="slds-form-element__control slds-input-has-icon slds-input-has-icon_right"
    >
      <input
        type="text"
        id="date-input-id-default"
        placeholder={placeholder}
        class="slds-input"
        disabled={disabled}
        required={required}
        onkeypress={preventTyping}
        onfocus={handleDatepickerFocus}
        onclick={handleDatepickerClick}
        onchange={handleDatepickerInput}
      />
      <lightning-icon
        class="slds-icon slds-input__icon slds-input__icon_right slds-icon-text-default"
        size="xx-small"
        icon-name="utility:event"
      ></lightning-icon>
    </div>
    <div
      aria-hidden="false"
      class="slds-datepicker slds-dropdown slds-dropdown_left"
      role="dialog"
      onclick={handleDatepickerClick}
    >
      <div class="slds-datepicker__filter slds-grid">
        <div
          class="slds-datepicker__filter_month slds-grid slds-grid_align-spread slds-grow"
        >
          <div class="slds-align-middle">
            <lightning-button-icon
              icon-name="utility:left"
              size="medium"
              variant="container"
              onclick={previousMonth}
            ></lightning-button-icon>
          </div>
          <h2
            aria-atomic="true"
            aria-live="assertive"
            class="slds-align-middle"
            id="defaultPicker-month"
          >
            {month}
          </h2>
          <div class="slds-align-middle">
            <lightning-button-icon
              icon-name="utility:right"
              size="medium"
              variant="container"
              onclick={nextMonth}
            ></lightning-button-icon>
          </div>
        </div>

        <div class="slds-shrink-none">
          <div class="slds-select_container">
            <select class="slds-select" onchange={handleYearChange}>
              <template for:each={years} for:item="year">
                <option key={year}>{year}</option>
              </template>
            </select>
          </div>
        </div>
      </div>

      <table
        aria-labelledby="defaultPicker-month"
        aria-multiselectable="true"
        class="slds-datepicker__month"
        role="grid"
      >
        <thead>
          <tr>
            <template for:each={weekdays} for:item="weekday">
              <th key={weekday.short} scope="col">
                <abbr title={weekday.long}>{weekday.short}</abbr>
              </th>
            </template>
          </tr>
        </thead>
        <tbody>
          <template for:each={weeks} for:item="week">
            <tr key={week.monthWeek}>
              <template for:each={week.week} for:item="day">
                <td
                  key={day.date}
                  class={day.classList}
                  aria-label={day.date}
                  role="gridcell"
                >
                  <span
                    class="slds-day"
                    data-date={day.date}
                    data-disabled={day.disabled}
                    onclick={handleDateSelect}
                    >{day.monthDay}</span
                  >
                </td>
              </template>
            </tr>
          </template>
        </tbody>
      </table>
      <button
        class="slds-button slds-align_absolute-center slds-text-link"
        onclick={goToToday}
      >
        {labels.todayLink}
      </button>
    </div>
    <div if:false={validity} class="slds-form-element__help">
      {errorMessage}
    </div>
  </div>
</template>
