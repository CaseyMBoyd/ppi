<!-- Order Position -->
<template>
    <div class="slds-border_top slds-border_bottom slds-border_left slds-border_right slds-p-around_small slds-m-around_small">
        <lightning-layout>
            <lightning-layout-item size=10>
                <lightning-layout multiple-rows>
                    <lightning-layout-item size=3 class="slds-p-horizontal_xx-small">
                        PO Number: {order.PoNumber}
                    </lightning-layout-item>
                    <lightning-layout-item size=3 class="slds-p-horizontal_xx-small">
                        PPI Order Number:&nbsp;
                        <p style="cursor: pointer" onclick={handleViewDetails} class="slds-text-heading_small">{order.PPI_Order_Number__c}</p>
                    </lightning-layout-item>
                    <lightning-layout-item size=3 class="slds-p-horizontal_xx-small">
                        Ordered Date: {order.Ordered_Date_Only__c}
                    </lightning-layout-item>
                    <lightning-layout-item size=3 class="slds-p-horizontal_xx-small">
                        Status: {order.Order_Status__c}
                    </lightning-layout-item>
                    <lightning-layout-item size=3 class="slds-m-horizontal_xx-small">
                        Total: <lightning-formatted-number value={order.TotalAmount} format-style="currency" currency-code="USD"></lightning-formatted-number>
                    </lightning-layout-item>
                </lightning-layout>
            </lightning-layout-item>
            <lightning-layout-item size=2>
                <lightning-button variant="brand-outline" label="Start Reorder" onclick={handleReorder} class="slds-button_full-width slds-align_absolute-center slds-m-vertical_x-small" disabled={order.reorderDisabled}></lightning-button>
                <lightning-button variant="base" label="View Details" onclick={handleViewDetails} class="slds-button_full-width slds-align_absolute-center slds-m-vertical_x-small"></lightning-button>
            </lightning-layout-item>
        </lightning-layout>
    </div>
</template>
