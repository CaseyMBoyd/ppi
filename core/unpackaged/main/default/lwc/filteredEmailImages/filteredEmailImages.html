<template>
    <lightning-card title="Filtered Embedded Images" icon-name="doctype:image">

        <template if:true={hasImages}>

            <div class="table-container">

                <table class="slds-table slds-table_cell-buffer slds-table_bordered">

                    <thead>
                        <tr class="slds-line-height_reset">

                            <th scope="col" class="file-name-column">
                                <div class="slds-truncate" title="File Name">
                                    File Name
                                </div>
                            </th>

                            <th scope="col" class="size-column">
                                <div class="slds-truncate" title="Size">
                                    Size
                                </div>
                            </th>

                            <th scope="col" class="actions-column">
                                <div class="slds-truncate" title="Actions">
                                    <center>Actions</center>
                                </div>
                            </th>

                        </tr>
                    </thead>

                    <tbody>

                        <template for:each={images} for:item="image">

                            <tr key={image.id}>

                                <!-- File Name -->
                                <td>
                                    <div class="slds-truncate"
                                         title={image.title}>
                                        {image.title}
                                    </div>
                                </td>

                                <!-- Size -->
                                <td>
                                    <div class="slds-truncate"
                                         title={image.size}>
                                        {image.size}
                                    </div>
                                </td>

                                <!-- Actions -->
                                <td>
                                    <div class="action-buttons">

                                        <lightning-button
                                            label="Preview"
                                            variant="neutral"
                                            data-id={image.id}
                                            onclick={handlePreview}>
                                        </lightning-button>
&nbsp;&nbsp;&nbsp;&nbsp;
                                        <lightning-button
                                            label="Add to Files"
                                            variant="brand"
                                            data-documentid={image.contentDocumentId}
                                            onclick={handleAddToFiles}>
                                        </lightning-button>

                                    </div>
                                </td>

                            </tr>

                        </template>

                    </tbody>

                </table>

            </div>

        </template>

        <template if:false={hasImages}>

            <div class="slds-p-around_medium slds-text-align_center">
                No filtered embedded images found.
            </div>

        </template>

    </lightning-card>


    <!-- Preview Modal -->
    <template if:true={isPreviewOpen}>

        <section
            role="dialog"
            tabindex="-1"
            aria-modal="true"
            aria-labelledby="preview-heading"
            class="slds-modal slds-fade-in-open">

            <div class="slds-modal__container">

                <header class="slds-modal__header">

                    <button
                        class="slds-button slds-button_icon slds-modal__close"
                        title="Close"
                        onclick={closePreview}>

                        <lightning-icon
                            icon-name="utility:close"
                            alternative-text="Close"
                            size="small">
                        </lightning-icon>

                        <span class="slds-assistive-text">
                            Close
                        </span>

                    </button>

                    <h2
                        id="preview-heading"
                        class="slds-text-heading_medium">
                        {previewTitle}
                    </h2>

                </header>

                <div class="slds-modal__content slds-p-around_medium preview-container">

                    <img
                        src={previewUrl}
                        alt={previewTitle}
                        class="preview-image" />

                </div>

                <footer class="slds-modal__footer">

                    <lightning-button
                        label="Close"
                        onclick={closePreview}>
                    </lightning-button>

                </footer>

            </div>

        </section>

        <div class="slds-backdrop slds-backdrop_open"></div>

    </template>

</template>
