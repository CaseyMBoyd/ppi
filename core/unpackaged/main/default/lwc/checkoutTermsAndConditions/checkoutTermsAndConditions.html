<!-- Checkout Terms And Conditions -->
<template>
    <div>
        <input
          type="checkbox"
          id="termsandconditions"
          name="terms"
          checked={checked}
          disabled={disableCheckbox}
          onchange={handleChange}
        ></input>
        <label class="slds-p-left_x-small" for="termsandconditions">
            I accept the <a href={privacyLink}>Privacy Policy</a>, <a href={termsAndConditionLink}>Terms and Conditions</a>, and <a href={websitePrivacyLink}>Website Policy</a>
        </label>
    </div>
    <label if:true={showError} class="slds-text-color_error">
        {error}
    </label>
</template>
